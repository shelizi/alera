  zh-CN: "所选文件及文件夹（含内容）将被永久删除，不会移至回收站。请确认所选项目后再继续。"
  ja: "選択したファイルとフォルダー（内容を含む）はごみ箱に移動せず完全に削除されます。選択内容を確認してください。"
