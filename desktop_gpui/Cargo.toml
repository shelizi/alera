[package]
name = "alera-gpui-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental native GPUI desktop frontend for Alera"

[[bin]]
name = "alera-gpui-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

# Deliberately separate from rust/Cargo.toml: Flutter, mobile, and the
# production CLI/host must not acquire GPUI dependencies in this experiment.
[workspace]
resolver = "2"

[features]
default = ["native-ui"]
native-ui = ["dep:gpui-kit"]
# Explicitly opt-in visual QA build only; never enabled by default or
# in a release build. The app does not contact the real Host in fixture mode.
quota-visual-fixture = []

[dependencies]
gpui-kit = { version = "=0.9.0", optional = true }
alera-core = { path = "../rust/alera-core", default-features = false }
git2 = { version = "0.21.0", default-features = false }
notify = "=8.2.0"
dunce = "=1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
unicode-segmentation = "1.12"
rust-i18n = "=4.2.4"
alacritty_terminal = "=0.26.0"

[target.'cfg(windows)'.dependencies]
# Native toast WinRT and isolated Win32 COM activation callback. Classic's
# Flutter registration and Runtime Host dependencies remain untouched.
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Notifications"] }
# #[implement] generates direct windows_core references for COM vtables.
windows-core = "=0.62.2"

[dev-dependencies]
tempfile = "3.27.0"
