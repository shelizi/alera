name: Mobile Builds

on:
  pull_request:
    branches:
      - main
    paths:
      - pubspec.yaml
      - pubspec.lock
      - mobile/**
      - packages/alera_configuration/**
      - third_party/xterm
      - .gitmodules
      - rust/**
      - rust_builder/**
      - .github/actions/setup-flutter-workspace/**
      - .github/actions/setup-rust-sccache/**
      - .github/actions/init-required-submodules/**
      - .github/workflows/mobile-build.yml
      - tool/release/verify_android_native_dependencies.sh
  workflow_dispatch:
    inputs:
      platform:
        description: Platform for manual build
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build mobile ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'android' && '["android"]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'ios' && '["ios"]' || '["android","ios"]') }}
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          working-directory: mobile
          submodules: third_party/xterm
          linux-toolchain: 'false'
          native-assets: 'false'
          preflight: 'false'
          rust: 'true'

      # Linux runner builds the same Rust Whisper FFI library used by Android.
      # libclang must be discoverable by bindgen before Gradle invokes Cargo.
      - name: Provision Android native build tools
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build
          libclang="$(find /usr/lib -name libclang.so -print -quit)"
          test -n "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Select Java 17
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      # No distribution credentials are available here. Android uses its
      # existing debug-key fallback; Apple builds explicitly disable signing.
      - name: Analyze Android mobile app
        if: matrix.platform == 'android'
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Test Android mobile app
        if: matrix.platform == 'android'
        working-directory: mobile
        run: flutter test --no-pub

      - name: Build Android release APK
        if: matrix.platform == 'android'
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify Android native dependencies
        if: matrix.platform == 'android'
        shell: bash
        run: bash tool/release/verify_android_native_dependencies.sh mobile/build/app/outputs/flutter-apk

      # Debug-key fallback: a test artifact, not a signed production release.
      - name: Record Android smoke APK checksum
        if: matrix.platform == 'android'
        working-directory: mobile/build/app/outputs/flutter-apk
        shell: bash
        run: |
          set -euo pipefail
          sha256sum *-release.apk | tee SHA256SUMS

      - name: Upload Android smoke APK (debug-key signed)
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-debug-key-${{ github.run_id }}
          path: |
            mobile/build/app/outputs/flutter-apk/*-release.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Build iOS device release
        if: matrix.platform == 'ios'
        working-directory: mobile
        run: flutter build ios --release --no-codesign --verbose

      - name: Build iOS simulator
        if: matrix.platform == 'ios'
        working-directory: mobile
        run: flutter build ios --simulator --debug --no-codesign --verbose

      - name: Record resolved iOS dependencies
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v7
        with:
          name: ios-dependency-lock
          path: mobile/ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7

      - name: Verify iOS dependency lock is current
        if: matrix.platform == 'ios'
        run: git diff --exit-code -- mobile/ios/Podfile.lock
