name: Fork macOS Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
    format('Fork macOS Release from {0}', inputs.ref) ||
    format('Fork macOS Release after Windows run {0}', github.event.workflow_run.id) }}

# The fork keeps publishing portable GitHub Release assets without the upstream
# signed updater/index infrastructure. For normal releases this workflow waits
# until Fork Windows Release has completed successfully, then appends the
# matching unsigned macOS ARM64 archive to the same GitHub Release.
on:
  workflow_run:
    workflows:
      - Fork Windows Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to release; the tag comes from its pubspec version
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: fork-macos-release
  cancel-in-progress: false

env:
  ALERA_FLAVOR: release

jobs:
  build:
    if: >-
      github.repository == 'shelizi/alera' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.ref ||
                github.event.workflow_run.head_sha }}
          submodules: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          [[ -n "$version" ]] || { echo "::error::pubspec.yaml has no version."; exit 1; }
          release="${version%%+*}"
          tag="v$release"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "Releasing $version as $tag"

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: |
            build/**/cargokit_build
            build/**/ck
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build macOS app
        shell: bash
        env:
          ALERA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flutter build macos --release \
            --dart-define=ALERA_FLAVOR=release \
            --dart-define=ALERA_RELEASE_PAGE_URL=https://github.com/${{ github.repository }}/releases

      - name: Verify macOS ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -d "$bundle" ]] || { echo "::error::Missing macOS app bundle."; exit 1; }
          bash tool/release/verify_macos_arm64_only.sh "$bundle"

      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -d "$bundle" ]] || { echo "::error::Missing macOS app bundle."; exit 1; }
          release="${VERSION%%+*}"
          name="alera-$release-macos-arm64.tar.gz"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/$name" \
            -C "$(dirname "$bundle")" "$(basename "$bundle")"
          shasum -a 256 "dist/$name" | sed 's#  dist/#  #' >"dist/$name.sha256"
          ls -lh dist

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: fork-macos-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      TARGET_SHA: ${{ needs.build.outputs.target_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.target_sha }}
          fetch-depth: 0
          submodules: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Download macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-macos-release
          path: dist

      - name: Ensure GitHub Release exists
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TARGET_SHA^" 2>/dev/null || true)"
          args=(--scope desktop --repo "$GITHUB_REPOSITORY" --tag "$TAG" --target "$TARGET_SHA" --output release-notes.md)
          if [[ -n "$previous" ]]; then
            args+=(--previous-tag "$previous")
          fi
          dart tool/release/generate_release_notes.dart "${args[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$TARGET_SHA" --title "$TAG" --notes-file release-notes.md

      - name: Publish macOS asset
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          for asset in dist/*; do
            name="$(basename "$asset")"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[].name" | grep -Fxq "$name" || { echo "::error::Missing asset $name"; exit 1; }
          done

          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
