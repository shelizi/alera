name: Fork Portable Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
    format('Fork Portable Release from {0}', inputs.ref) ||
    format('Fork Portable Release {0}', github.ref_name) }}

# The upstream Cut Release pipeline publishes to the upstream update bucket and
# needs its signing keys, so it cannot run on this fork. This workflow only
# builds Windows, macOS and Android and attaches them to one GitHub Release: no updater index,
# no package managers. Android uses the fork's persistent APK signing key.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to release; the tag comes from its pubspec version
        required: false
        type: string
        default: main

permissions:
  contents: read

# Never cancel mid-publish: a cancelled run could leave a partial release.
concurrency:
  group: fork-portable-release
  cancel-in-progress: false

env:
  ALERA_FLAVOR: release

jobs:
  build-windows:
    if: github.repository == 'shelizi/alera'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw 'pubspec.yaml has no version.' }
          $version = $line.Matches[0].Groups[1].Value
          $release = $version.Split('+')[0]
          $tag = "v$release"
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -ne $tag) {
            throw "Tag $env:REF_NAME does not match pubspec version $version (expected $tag)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "target_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version as $tag"

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Tune Windows build environment
        uses: ./.github/actions/tune-windows-build

      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: |
            build/**/cargokit_build
            build/**/ck
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Windows app
        shell: pwsh
        env:
          # Stamps the bundled runtime sidecar with the app version instead of
          # the Cargo crate version.
          ALERA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          flutter build windows --release
          --dart-define=ALERA_FLAVOR=release
          --dart-define=ALERA_RELEASE_PAGE_URL=https://github.com/${{ github.repository }}/releases

      - name: Package release zip
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $release = 'build/windows/x64/runner/Release'
          foreach ($required in "$release/Alera.exe", "$release/resources/alera/alera.exe") {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing $required." }
          }
          $name = "alera-$($env:VERSION.Split('+')[0])-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath "dist/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "dist/$name.sha256"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: fork-windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    if: github.repository == 'shelizi/alera'
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          [[ -n "$version" ]] || { echo "::error::pubspec.yaml has no version."; exit 1; }
          release="${version%%+*}"
          tag="v$release"
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $REF_NAME does not match pubspec version $version (expected $tag)."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "Releasing $version as $tag"

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: |
            build/**/cargokit_build
            build/**/ck
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build macOS app
        shell: bash
        env:
          ALERA_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flutter build macos --release \
            --dart-define=ALERA_FLAVOR=release \
            --dart-define=ALERA_RELEASE_PAGE_URL=https://github.com/${{ github.repository }}/releases

      - name: Verify macOS ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -d "$bundle" ]] || { echo "::error::Missing macOS app bundle."; exit 1; }
          bash tool/release/verify_macos_arm64_only.sh "$bundle"

      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -d "$bundle" ]] || { echo "::error::Missing macOS app bundle."; exit 1; }
          release="${VERSION%%+*}"
          name="alera-$release-macos-arm64.tar.gz"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/$name" \
            -C "$(dirname "$bundle")" "$(basename "$bundle")"
          shasum -a 256 "dist/$name" | sed 's#  dist/#  #' >"dist/$name.sha256"
          ls -lh dist

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: fork-macos-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    if: github.repository == 'shelizi/alera'
    uses: ./.github/workflows/fork-android-release.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
    secrets: inherit

  publish:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build-windows.outputs.tag }}
      TARGET_SHA: ${{ needs.build-windows.outputs.target_sha }}
      MACOS_TAG: ${{ needs.build-macos.outputs.tag }}
      MACOS_TARGET_SHA: ${{ needs.build-macos.outputs.target_sha }}
      ANDROID_TAG: ${{ needs.build-android.outputs.tag }}
      ANDROID_TARGET_SHA: ${{ needs.build-android.outputs.target_sha }}
      MOBILE_VERSION: ${{ needs.build-android.outputs.mobile_version }}
      MOBILE_TAG: ${{ needs.build-android.outputs.mobile_tag }}
    steps:
      - name: Verify build metadata
        run: |
          set -euo pipefail
          [[ "$TAG" == "$MACOS_TAG" ]] || { echo "::error::Windows and macOS tags differ."; exit 1; }
          [[ "$TARGET_SHA" == "$MACOS_TARGET_SHA" ]] || { echo "::error::Windows and macOS commits differ."; exit 1; }
          [[ "$TAG" == "$ANDROID_TAG" ]] || { echo "::error::Desktop and Android release tags differ."; exit 1; }
          [[ "$TARGET_SHA" == "$ANDROID_TARGET_SHA" ]] || { echo "::error::Desktop and Android commits differ."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-windows.outputs.target_sha }}
          fetch-depth: 0
          submodules: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Download release zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-windows-release
          path: dist

      - name: Download macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-macos-release
          path: dist

      - name: Generate release notes
        run: |
          set -euo pipefail
          # Notes start at the previous fork release. The first fork release has
          # none, so it starts at the newest upstream tag in this history.
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TARGET_SHA^" 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            git fetch --quiet --no-tags https://github.com/leynier/alera.git '+refs/tags/v*:refs/tags/upstream/v*'
            # Not `git describe`: these annotated tags still carry their upstream
            # name, and describe prints `v0.82.0-1032-g<sha>` once the ref name
            # differs from it. Pass the commit, since the fork has no such tag.
            upstream_tag="$(git tag --list 'upstream/v*' --merged "$TARGET_SHA" --sort=-v:refname \
              | grep -E '^upstream/v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$upstream_tag" ]]; then
              previous="$(git rev-parse "$upstream_tag^{commit}")"
            fi
          fi
          args=(--scope desktop --repo "$GITHUB_REPOSITORY" --tag "$TAG" --target "$TARGET_SHA" --output release-notes.md)
          if [[ -n "$previous" ]]; then
            args+=(--previous-tag "$previous")
          fi
          echo "Release notes from ${previous:-the start of history} to $TAG"
          dart tool/release/generate_release_notes.dart "${args[@]}"
          mobile_previous="$(git describe --tags --abbrev=0 --match '*-mobile' "$TARGET_SHA^" 2>/dev/null || true)"
          mobile_args=(--scope mobile --repo "$GITHUB_REPOSITORY" --tag "$MOBILE_TAG" --target "$TARGET_SHA" --output mobile-release-notes.md)
          if [[ -n "$mobile_previous" ]]; then
            mobile_args+=(--previous-tag "$mobile_previous")
          fi
          dart tool/release/generate_release_notes.dart "${mobile_args[@]}"
          printf '\nAndroid companion: [%s](https://github.com/%s/releases/tag/%s).\n' "$MOBILE_TAG" "$GITHUB_REPOSITORY" "$MOBILE_TAG" >> release-notes.md

      - name: Download Android APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-android-release
          path: dist

      - name: Verify complete release assets
        run: bash tool/release/verify_fork_release_assets.sh dist "${TAG#v}" "$MOBILE_VERSION"

      - name: Publish release
        run: |
          set -euo pipefail
          for release_tag in "$TAG" "$MOBILE_TAG"; do
            existing_sha="$(git ls-remote origin "refs/tags/$release_tag" "refs/tags/$release_tag^{}" | tail -n 1 | cut -f 1)"
            if [[ -n "$existing_sha" && "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "::error::Tag $release_tag points at another commit; bump its product version."
              exit 1
            fi
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [[ "$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
                echo "::error::Release $release_tag is already public; bump its product version."
                exit 1
              fi
            else
              notes=release-notes.md
              [[ "$release_tag" != "$MOBILE_TAG" ]] || notes=mobile-release-notes.md
              gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --draft \
                --target "$TARGET_SHA" --title "$release_tag" --notes-file "$notes"
            fi
          done
          bash tool/release/upload_release_assets.sh "$TAG" "$GITHUB_REPOSITORY" dist/*
          bash tool/release/upload_release_assets.sh "$MOBILE_TAG" "$GITHUB_REPOSITORY" dist/*-android.apk dist/*-android.apk.sha256
          # Publish only once every asset is attached, so nobody sees a partial release.
          for asset in dist/*; do
            name="$(basename "$asset")"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[].name" | grep -Fxq "$name" || { echo "::error::Missing asset $name"; exit 1; }
          done
          for asset in dist/*-android.apk dist/*-android.apk.sha256; do
            name="$(basename "$asset")"
            gh release view "$MOBILE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[].name" | grep -Fxq "$name" || { echo "::error::Missing mobile asset $name"; exit 1; }
          done
          gh release edit "$MOBILE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
